[tool.poetry]
name = "data_processing"
version = "0.1.0"
description = ""
authors = ["Eirik Kjærnli <eirik.kjarnli@gmail.com>"]
packages = [{include = "data_processing"}]

[tool.poetry.dependencies]
python = "^3.13.0"
python-dotenv = "^1.0.0"
openai = "^1.60.0"
jupyter = "^1.0.0"
ipykernel = "^6.29.1"
requests = "^2.31.0"
elasticsearch = "^8.0.0"
PyPDF2 = "^3.0.0"
numpy = "^1.26.0"
lovdata-processing = {path = "/Users/fabian.s.dietrichson/Develop/lovlig"}
beautifulsoup4 = "^4.14.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.6"
pylint = "^3.0.3"
pre-commit = "^2.20.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.1.3"
pytest-cov = "^4.0.0"

[tool.ruff]
line-length = 100
extend-ignore = ["E203", "D107"]

[tool.ruff.lint]
select = ["E", "W", "D", "F", "UP", "B", "SIM","I"]

[tool.ruff.lint.isort]
known-first-party = ["data_processing"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["python_package"]

[tool.pylint]
max-line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"