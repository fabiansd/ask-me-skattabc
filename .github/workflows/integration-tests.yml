name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ask_me_skattabc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:testpassword@localhost:5432/ask_me_skattabc_test" >> .env.test
          echo "USE_MOCK_DATA=true" >> .env.test
          echo "ELASTICSEARCH_URL=http://localhost:9200" >> .env.test
          echo "ELASTIC_PASSWORD=testpassword" >> .env.test
          echo "OPENAI_API_KEY=test-key" >> .env.test
          echo "NEXTAUTH_SECRET=test-secret" >> .env.test
          echo "NEXTAUTH_URL=http://localhost:3000" >> .env.test

      - name: Run database migrations
        run: DATABASE_URL="postgresql://postgres:testpassword@localhost:5432/ask_me_skattabc_test" npx prisma migrate deploy

      - name: Run integration tests
        run: npm run test:db:ci
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/ask_me_skattabc_test
